<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Sign in — Scheff Writer</title>
    <link rel="icon" href="/static/favicon.png">
    <link rel="stylesheet" href="/static/tokens.css">
    <style>
        body {
            font-family: var(--font-sans);
            background: var(--color-page-bg);
            color: var(--color-text-main);
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: var(--space-4);
            box-sizing: border-box;
        }
        .card {
            width: 100%;
            max-width: 22rem;
            background: var(--color-card-bg);
            border: 1px solid var(--color-border);
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-card);
            padding: var(--space-8) var(--space-6);
        }
        .brand { display: flex; align-items: center; gap: var(--space-3); margin-bottom: var(--space-6); }
        .brand img { width: 36px; height: 36px; }
        .brand h1 { font-family: var(--font-display); font-size: 1.75rem; font-weight: 500; margin: 0; color: var(--color-primary); }
        label { display: block; font-size: 0.8rem; color: var(--color-text-muted); margin-bottom: var(--space-2); }
        input[type=password] {
            width: 100%; box-sizing: border-box;
            font: inherit; padding: var(--space-2) var(--space-3);
            border: 1px solid var(--color-border); border-radius: var(--radius-md);
            background: var(--color-bg-base); color: var(--color-text-main);
        }
        input[type=password]:focus { outline: 2px solid var(--color-accent); outline-offset: 1px; }
        button {
            margin-top: var(--space-4); width: 100%;
            font: inherit; font-weight: 600; padding: var(--space-2) var(--space-3);
            border: 0; border-radius: var(--radius-md);
            background: var(--color-accent); color: #fff; cursor: pointer;
        }
        button:hover { background: var(--color-accent-hover); }
        .err { color: #b42318; font-size: 1rem; margin: 0 0 var(--space-3); }
    </style>
</head>
<body>
    <main class="card">
        <div class="brand">
            <img src="/static/logo.png" alt="">
            <h1>Scheff Writer</h1>
        </div>
        {{if .Failed}}<p class="err" role="alert">That token didn't match. Try again.</p>{{end}}
        <form method="post" action="/login">
            <input type="hidden" name="next" value="{{.Next}}">
            <label for="token">Access token</label>
            <input type="password" id="token" name="token" autocomplete="current-password" required autofocus>
            <button type="submit">Sign in</button>
        </form>
    </main>
</body>
</html>
